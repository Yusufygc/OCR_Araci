name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: pip

    - name: Etiket ile src/version.py uyumunu denetle
      shell: bash
      env:
        TAG: ${{ github.ref_name }}
      run: python tools/release.py --check-tag "$TAG"

    - name: Bağımlılıkları kur
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-build.txt

    - name: Testler (kırmızıysa yayın yok)
      shell: bash
      env:
        QT_QPA_PLATFORM: offscreen
      run: python -m unittest discover tests

    - name: Inno Setup kur
      shell: bash
      run: |
        if ! command -v ISCC >/dev/null 2>&1 && [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
          choco install innosetup -y
        fi

    - name: Kararlı exe ve kurulum dosyasını derle
      shell: bash
      run: python build_installer.py

    - name: GitHub Release oluştur
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        flags=""
        case "$TAG" in *-*) flags="--prerelease" ;; esac
        gh release create "$TAG" dist/installer/* --title "$TAG" --generate-notes --verify-tag $flags
